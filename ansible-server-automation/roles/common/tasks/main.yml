---
- name: Verify supported Linux distribution family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: >-
      This role supports Debian-family and RedHat-family Linux distributions.

- name: Refresh APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['pkg_mgr'] == 'apt'
  become: true

- name: Refresh DNF package metadata
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['pkg_mgr'] == 'dnf'
  become: true

- name: Refresh YUM package metadata
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['pkg_mgr'] == 'yum'
  become: true

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  become: true

- name: Install required packages
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
