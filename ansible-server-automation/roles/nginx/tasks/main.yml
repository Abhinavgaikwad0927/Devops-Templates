---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present
  become: true

- name: Ensure Nginx site directory exists
  ansible.builtin.file:
    path: "{{ nginx_site_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_dir }}/ansible-managed.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx
  become: true

- name: Deploy website homepage
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_site_dir }}/index.html"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  become: true

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true
  become: true
